services:
  - type: web
    name: resonance-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: resonance-data
      mountPath: /data
      sizeGB: 1
  - type: web
    name: resonance-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
